name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          # O pnpm só existe depois do corepack; o cache do pnpm é feito abaixo.
          package-manager-cache: false

      - name: Ativa o pnpm fixado no package.json
        run: corepack enable pnpm

      - name: Local da store do pnpm
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache do pnpm
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: ignore

      - run: pnpm build

  e2e:
    name: Testes ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: qualidade
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          # O pnpm só existe depois do corepack; o cache do pnpm é feito abaixo.
          package-manager-cache: false

      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Playwright (build de produção com TMDB simulada)
        run: pnpm test:e2e
        env:
          CI: true

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
